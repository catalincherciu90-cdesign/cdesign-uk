<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Website — C Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--c:#00AAAC;--cd:#008587;--ink:#1a1f24;--body:#5b6472;--line:#e7ebf0;--soft:#f5f7fa}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
  h1,h2,h3{font-family:'Poppins',sans-serif}
  .wrap{max-width:1160px;margin:0 auto;padding:0 26px}
  .demo-tagbar{background:var(--ink);color:#fff;text-align:center;font-size:.8rem;letter-spacing:.04em;padding:8px 12px}
  .demo-tagbar a{color:#fff;text-decoration:underline;font-weight:600}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:72px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:1.25rem;color:var(--ink)}
  .logo .mk{width:38px;height:38px;border-radius:11px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
  .nav-links{display:flex;gap:30px;font-family:'Poppins',sans-serif;font-weight:500;font-size:.95rem;color:var(--ink)}
  .nav-links a:hover{color:var(--c)}
  .btn{display:inline-block;background:var(--c);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;padding:12px 26px;border-radius:999px;font-size:.92rem;transition:.2s}
  .btn:hover{background:var(--cd);transform:translateY(-2px)}
  .hero{position:relative;color:#fff;padding:120px 26px;text-align:center;background-color:var(--cd)}
  .hero .wrap{position:relative;z-index:2;max-width:800px}
  .hero .eyebrow{display:inline-block;background:rgba(255,255,255,.16);padding:7px 16px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.05em;margin-bottom:22px}
  .hero h1{font-size:clamp(2.4rem,5.5vw,4rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:18px}
  .hero p{font-size:1.2rem;opacity:.94;margin-bottom:32px;line-height:1.6}
  .hero .btn{background:#fff;color:var(--ink)}
  .hero .btn:hover{background:var(--ink);color:#fff}
  section{padding:90px 0}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 56px}
  .sec-head .eyebrow{color:var(--c);font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;display:block}
  .sec-head h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:700;color:var(--ink);letter-spacing:-.02em}
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1080px;margin:0 auto}
  .feat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 28px;transition:.2s}
  .feat:hover{transform:translateY(-6px);box-shadow:0 24px 50px -24px rgba(20,30,50,.25)}
  .feat .ic{width:56px;height:56px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:20px}
  .feat h3{font-size:1.2rem;font-weight:600;color:var(--ink);margin-bottom:9px}
  .feat p{font-size:.96rem;line-height:1.6}
  .about{background:var(--soft)}
  .about-in{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;max-width:1080px;margin:0 auto}
  .about-img{aspect-ratio:4/3;border-radius:20px;background-color:var(--cd);background-size:cover;background-position:center;box-shadow:0 26px 60px -30px rgba(20,30,50,.5)}
  .about h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:700;color:var(--ink);margin-bottom:18px;letter-spacing:-.02em}
  .about p{font-size:1.05rem;line-height:1.8;margin-bottom:22px}
  .cta{background:var(--ink);color:#fff;text-align:center}
  .cta h2{font-size:clamp(2rem,4.5vw,3rem);color:#fff;margin-bottom:14px}
  .cta p{opacity:.8;font-size:1.1rem;margin-bottom:28px}
  footer{background:#0c1016;color:#9aa6b2;padding:50px 26px;text-align:center;font-size:.9rem}
  footer .logo{justify-content:center;color:#fff;margin-bottom:14px}
  footer a{color:#c3ccd6}footer a:hover{color:#fff}
  @media(max-width:820px){.nav-links{display:none}.feat-grid{grid-template-columns:1fr}.about-in{grid-template-columns:1fr;gap:32px}.hero{padding:80px 22px}}
</style>
</head>
