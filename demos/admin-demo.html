<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Demo by C Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#00AAAC;--teal-dk:#008587;--ink:#1a2028;--body:#5b6472;--muted:#8b94a3;--line:#eaeef2;--bg:#f5f7fa;--side:#141b24;--green:#16a34a;--red:#dc2626;--amber:#d97706}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;color:var(--body);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .demo-tagbar{background:#141719;color:#fff;text-align:center;font-size:.8rem;padding:8px 12px;font-family:sans-serif}
  .demo-tagbar a{color:#fff;text-decoration:underline;font-weight:600}
  .layout{display:flex;min-height:calc(100vh - 34px)}
  .side{width:250px;background:var(--side);color:#c7d0da;flex:none;display:flex;flex-direction:column;padding:22px 16px}
  .side-logo{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;font-family:'Poppins',sans-serif;font-weight:700;font-size:1.12rem;color:#fff}
  .side-logo .mk{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
  .side-sec{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#5d6b7a;margin:16px 12px 8px}
  .side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;font-family:'Poppins',sans-serif;font-weight:500;font-size:.92rem;color:#aeb9c5;margin-bottom:2px;transition:.15s;cursor:pointer}
  .side a .ic{width:18px;text-align:center}
  .side a:hover{background:rgba(255,255,255,.06);color:#fff}
  .side a.active{background:var(--teal);color:#062024;font-weight:600}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.07)}
  .side-foot .av{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#062024;font-weight:700;font-size:.85rem}
  .side-foot .nm{font-size:.85rem;color:#fff;font-weight:600}
  .side-foot .rl{font-size:.72rem;color:#7a8797}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .topbar .tt{display:flex;align-items:center;gap:12px}
  .burger{display:none;background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--ink)}
  .topbar h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.25rem;color:var(--ink)}
  .topbar .right{display:flex;align-items:center;gap:14px}
  .search{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:.88rem;color:var(--muted);width:220px}
  .btn{background:var(--teal);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:.88rem;padding:10px 18px;border:0;border-radius:9px;cursor:pointer}
  .content{padding:26px 28px;overflow:auto}
  .demo-badge{display:inline-block;background:rgba(0,170,172,.12);color:var(--teal-dk);font-family:'Poppins',sans-serif;font-weight:600;font-size:.74rem;padding:5px 12px;border-radius:20px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .kpi .lbl{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
  .kpi .lbl .i{width:32px;height:32px;border-radius:9px;background:rgba(0,170,172,.1);display:flex;align-items:center;justify-content:center;font-size:1rem}
  .kpi .val{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.7rem;color:var(--ink);margin-top:12px}
  .kpi .tr{font-size:.8rem;font-weight:600;margin-top:4px}
  .up{color:var(--green)}.down{color:var(--red)}
  .row{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .card h3{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);margin-bottom:4px}
  .card .sub{font-size:.82rem;color:var(--muted);margin-bottom:18px}
  .chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{width:100%;max-width:36px;background:var(--teal);border-radius:7px 7px 4px 4px;opacity:.9;transition:.2s}
  .bar-wrap:hover .bar{opacity:1}
  .bar-lbl{font-size:.72rem;color:var(--muted)}
  .msg{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .msg:last-child{border-bottom:0}
  .msg .av{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
  .msg .nm{font-family:'Poppins',sans-serif;font-weight:600;font-size:.88rem;color:var(--ink)}
  .msg .tx{font-size:.82rem;color:var(--muted)}
  .msg .tm{margin-left:auto;font-size:.72rem;color:var(--muted);white-space:nowrap}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 12px}
  td{padding:13px 12px;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink)}
  .pill{display:inline-block;font-size:.74rem;font-weight:600;padding:4px 11px;border-radius:20px}
  .pill.ok{background:rgba(22,163,74,.12);color:var(--green)}
  .pill.warn{background:rgba(217,119,6,.12);color:var(--amber)}
  .pill.info{background:rgba(0,170,172,.12);color:var(--teal-dk)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--body);background:#fff;cursor:pointer}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pc .ph{height:120px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
  .pc .bd{padding:14px 16px}
  .pc .nm{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);font-size:.98rem}
  .pc .pr{color:var(--teal-dk);font-weight:700;margin-top:4px}
  .fld{margin-bottom:16px;max-width:520px}
  .fld label{display:block;font-family:'Poppins',sans-serif;font-weight:500;font-size:.85rem;color:var(--ink);margin-bottom:6px}
  .fld input,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-family:'Inter',sans-serif;font-size:.92rem;color:var(--ink);background:#fff}
  .toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem;color:var(--ink)}
  .sw{width:40px;height:22px;border-radius:999px;background:var(--teal);position:relative;flex:none}
  .sw::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px}
  .sw.off{background:#cdd5de}.sw.off::after{right:auto;left:3px}
  .backdrop{display:none}
  @media(max-width:900px){
    .side{position:fixed;top:34px;bottom:0;left:0;z-index:40;transform:translateX(-100%);transition:transform .25s}
    .side.open{transform:translateX(0)}
    .burger{display:block}.search{display:none}
    .kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.grid-cards{grid-template-columns:1fr 1fr}
    .backdrop.open{display:block;position:fixed;inset:34px 0 0;background:rgba(0,0,0,.4);z-index:35}
  }
  @media(max-width:520px){.kpis{grid-template-columns:1fr}.grid-cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="demo-tagbar">✦ This is a demo admin panel by C Design — <a href="/#contact">Get a website with an easy dashboard like this</a></div>
  <div class="layout">

        rows:[['#J-210','Emma Watson','1 Jul',['Scheduled','info']],['#J-209','David Jones','1 Jul',['Quoted','warn']],['#J-208','Sarah Lee','2 Jul',['Scheduled','info']],['#J-207','Tom Baker','30 Jun',['Done','ok']],['#J-206','Aisha Khan','30 Jun',['Done','ok']],['#J-205','Liam Murphy','29 Jun',['Done','ok']]]},

    leads:{ nav:[['📨','Enquiries'],['🗂️','Listings'],['👥','Clients'],['🗓️','Calendar']],

  function kpisHTML(){return '<div class="kpis">'+k.kpis.map(function(x){return '<div class="kpi"><div class="lbl"><span class="i">'+x[0]+'</span> '+esc(x[1])+'</div><div class="val">'+esc(x[2])+'</div><div class="tr '+x[4]+'">'+esc(x[3])+'</div></div>';}).join('')+'</div>';}

  function vBlog(){var posts=[['5 tips to grow your business online','Published','1 Jul'],['Why every business needs a website','Published','28 Jun'],['Our summer opening hours','Draft','25 Jun'],['Meet the team','Published','20 Jun']];
    var t={cols:['Title','Status','Date'],rows:posts.map(function(p){return [p[0],[p[1],p[1]==='Draft'?'warn':'ok'],p[2]];})};
    return toolbar('Blog','Post')+'<div class="card"><h3>Blog posts</h3><div class="sub">Write and publish articles</div>'+tableHTML(t)+'</div>';}
  function vSettings(){
    return '<div class="card" style="max-width:620px"><h3>Business settings</h3><div class="sub">Update your details any time</div>'
      +'<div class="fld"><label>Business name</label><input value="'+esc(d.n)+'"></div>'
      +'<div class="fld"><label>Email</label><input value="hello@mybusiness.co.uk"></div>'
      +'<div class="fld"><label>Phone</label><input value="+44 7700 900000"></div>'
      +'<div class="fld"><label>Opening hours</label><input value="Mon–Fri 9:00–18:00"></div>'
      +'<div class="toggle"><span class="sw"></span> Accept online bookings</div>'
      +'<div class="toggle"><span class="sw"></span> Email me new messages</div>'
      +'<div class="toggle"><span class="sw off"></span> Maintenance mode</div>'
      +'<button class="btn" style="margin-top:8px">Save changes</button></div>';
  }
  function viewFor(label){
    var l=label.toLowerCase();
    if(l==='dashboard') return vDashboard();
    if(/message/.test(l)) return vMessages();
    if(/analytic/.test(l)) return vAnalytics();
    if(/setting/.test(l)) return vSettings();
    if(/blog/.test(l)) return vBlog();
    if(/product|menu|listing|service|table/.test(l)) return vCatalog(label);
    if(/customer|client|guest|patient|member/.test(l)) return vPeople(label);
    return vRecords(label);
  }

  // build sidebar
  var navItems=[['🏠','Dashboard']].concat(k.nav).concat([['💬','Messages'],['📈','Analytics'],['✍️','Blog'],['⚙️','Settings']]);
  var side=document.getElementById('side');
  side.innerHTML='<div class="side-logo"><span class="mk">'+d.e+'</span> '+esc(d.n)+'</div>'
    +'<div class="side-sec">Main</div>'
    +navItems.map(function(m,i){var grow=(i===1+k.nav.length);return (grow?'<div class="side-sec">Grow</div>':'')+'<a data-label="'+esc(m[1])+'"'+(i===0?' class="active"':'')+'><span class="ic">'+m[0]+'</span> '+esc(m[1])+'</a>';}).join('')
    +'<div class="side-foot"><div class="av">JS</div><div><div class="nm">John Smith</div><div class="rl">Owner</div></div></div>';

  var bd=document.getElementById('bd');
  function show(label){
    document.getElementById('pageTitle').textContent=label;
    document.getElementById('view').innerHTML=viewFor(label);
    side.querySelectorAll('a').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-label')===label);});
    side.classList.remove('open'); bd.classList.remove('open');
    document.getElementById('view').scrollTop=0;
  }
  side.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){show(a.getAttribute('data-label'));});});
  document.getElementById('burger').addEventListener('click',function(){side.classList.toggle('open');bd.classList.toggle('open');});
  bd.addEventListener('click',function(){side.classList.remove('open');bd.classList.remove('open');});
  // chips are interactive (visual only)
  document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('chip')){var p=e.target.parentNode;p.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});e.target.classList.add('on');}});
  show('Dashboard');
</script>
</body>
</html>
