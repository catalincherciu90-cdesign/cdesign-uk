<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Design — Glob orbital (prototip)</title>
<style>
  :root{
    --teal:#00c8b4; --teal-lt:#5ff0e0; --teal-dk:#00a898;
    --bg:#03060a; --bg2:#070d16;
    --frame-bg:rgba(8,14,24,.97); --frame-border:rgba(0,200,180,.45);
    --text:#e8f3f1; --soft:#8fb3ad;
    --orbit-radius:380px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden;
  }

  /* ---------- starfield ---------- */
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:
     radial-gradient(ellipse 90% 60% at 50% 0%, #0a1726 0%, var(--bg) 60%);}
  .stars::before,.stars::after{
    content:''; position:absolute; inset:-50%; background-repeat:repeat;
    background-image:
      radial-gradient(1.4px 1.4px at 20px 30px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 120px 80px, #cfeee9, transparent),
      radial-gradient(1px 1px at 200px 160px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 300px 60px, #bfe9e2, transparent),
      radial-gradient(1px 1px at 380px 220px, #fff, transparent);
    background-size:420px 420px; opacity:.55;
    animation:drift 90s linear infinite;
  }
  .stars::after{background-size:300px 300px; opacity:.3; animation-duration:140s; animation-direction:reverse;}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(420px)}}

  /* ---------- scroll stage ---------- */
  .stage{position:relative; height:600vh; z-index:1;}
  .hero{position:sticky; top:0; height:100vh; overflow:hidden;
        display:flex; align-items:center; justify-content:center;}

  /* brand mark + hint */
  .brand{position:absolute; top:26px; left:0; right:0; text-align:center; z-index:30;
         font-weight:800; letter-spacing:.18em; font-size:.78rem; color:var(--soft);}
  .brand b{color:var(--teal)}
  .hint{position:absolute; bottom:26px; left:0; right:0; text-align:center; z-index:30;
        color:var(--soft); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase;
        transition:opacity .4s;}
  .hint span{display:block; margin-top:8px; font-size:1.1rem; animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}

  /* ---------- 3D scene ---------- */
  .scene{position:relative; width:1px; height:1px;}

  /* ---------- globe ---------- */
  .globe-wrap{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
              z-index:50;}
  .globe{
    width:300px; height:300px; border-radius:50%; position:relative; overflow:hidden;
    background:#06203b; /* ocean fallback if textures are slow to load */
    box-shadow:
      inset -26px -20px 70px rgba(0,0,0,.85),
      inset 18px 14px 50px rgba(120,200,255,.15),
      0 0 70px rgba(0,150,200,.40);
  }
  /* real Earth texture wrapped on the sphere; background-position pan = rotation */
  .globe .earth, .globe .clouds{position:absolute; inset:0;
    background-repeat:repeat-x; background-position:0 center; background-size:200% 100%;}
  .globe .earth{
    background-image:url('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
    animation:spin-earth 48s linear infinite;}
  .globe .clouds{
    background-image:url('https://unpkg.com/three-globe/example/img/earth-clouds.png');
    opacity:.5; mix-blend-mode:screen; animation:spin-earth 36s linear infinite;}
  @keyframes spin-earth{from{background-position:0 center}to{background-position:-200% center}}
  /* spherical shading: day highlight + night terminator for a real 3D look */
  .globe .sphere{position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 30% 26%, rgba(255,255,255,.30) 0%, transparent 26%),
      radial-gradient(circle at 72% 78%, rgba(0,0,10,.62) 0%, transparent 58%);
    box-shadow:inset -22px -16px 60px rgba(0,0,0,.65);}
  /* atmosphere glow */
  .atmo{position:absolute; left:50%; top:50%; width:360px; height:360px;
        transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
        background:radial-gradient(circle, transparent 56%, rgba(0,200,200,.30) 66%, transparent 78%);
        filter:blur(4px);}

  /* ---------- orbit + frames ---------- */
  .orbit{position:absolute; left:50%; top:50%; width:1px; height:1px;}
  /* native size is LARGE; JS only ever scales DOWN to the ring (≤1×) so text stays crisp.
     Position is set entirely by JS (manual perspective projection). */
  .frame{
    position:absolute; left:50%; top:50%; width:340px; min-height:200px;
    padding:26px 26px 24px; transform:translate(-50%,-50%);
    background:var(--frame-bg); border:1px solid var(--frame-border);
    border-radius:18px;
    box-shadow:0 16px 46px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
    transition:border-color .3s, box-shadow .3s;
  }
  .frame .ico{font-size:1.8rem; line-height:1}
  .frame h3{font-size:1.25rem; margin:10px 0 5px; color:#fff; letter-spacing:.01em}
  .frame .lead{font-size:.95rem; color:var(--soft); line-height:1.5}
  .frame ul{list-style:none; margin:12px 0 0; max-height:0; overflow:hidden; opacity:0;
            transition:max-height .45s ease, opacity .35s ease;}
  .frame ul li{font-size:.9rem; color:#cfe9e4; padding:6px 0 6px 20px; position:relative;}
  .frame ul li::before{content:'▸'; position:absolute; left:0; color:var(--teal)}
  .frame .badge{position:absolute; top:12px; right:14px; font-size:.62rem; letter-spacing:.12em;
    color:var(--teal); border:1px solid var(--frame-border); border-radius:20px; padding:3px 9px;
    text-transform:uppercase; background:rgba(0,200,180,.07)}
  .frame.focused{border-color:var(--teal); box-shadow:0 22px 60px rgba(0,0,0,.6), 0 0 40px rgba(0,200,180,.25)}
  .frame.focused ul{max-height:200px; opacity:1}

  /* progress rail */
  .rail{position:absolute; right:22px; top:50%; transform:translateY(-50%); z-index:30;
        display:flex; flex-direction:column; gap:10px;}
  .rail i{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.18);
          transition:all .3s; cursor:pointer;}
  .rail i.on{background:var(--teal); box-shadow:0 0 10px var(--teal); transform:scale(1.35)}

  @media(max-width:760px){
    :root{--orbit-radius:250px}
    .globe{width:200px;height:200px}.atmo{width:250px;height:250px}
    .frame{width:280px;}
    .rail{right:10px}
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="stage" id="stage">
  <section class="hero">
    <div class="brand"><b>C</b> DESIGN · UNIVERSUL TĂU DIGITAL</div>

    <div class="scene" id="scene">
      <div class="atmo"></div>
      <div class="globe-wrap" id="globeWrap">
        <div class="globe">
          <div class="earth"></div>
          <div class="clouds"></div>
          <div class="sphere"></div>
        </div>
      </div>
      <div class="orbit" id="orbit"><!-- frames injected by JS --></div>
    </div>

    <div class="rail" id="rail"></div>
    <div class="hint" id="hint">Derulează pentru a explora<span>↓</span></div>
  </section>
</div>

<script>
  // ---- sections shown as orbiting frames ----
  const SECTIONS = [
    { ico:'🎨', tag:'01', title:'Servicii',   lead:'Site-uri moderne, rapide și optimizate.',
      bullets:['Site de prezentare','Magazin online','Redesign & mentenanță'] },
    { ico:'🖼️', tag:'02', title:'Portofoliu', lead:'Proiecte reale, rezultate măsurabile.',
      bullets:['+120 proiecte livrate','Design la comandă','Studii de caz'] },
    { ico:'⚙️', tag:'03', title:'Proces',     lead:'De la idee la lansare, fără bătăi de cap.',
      bullets:['Brief & strategie','Design & dezvoltare','Lansare & suport'] },
    { ico:'🚀', tag:'04', title:'Despre noi',  lead:'O echipă mică, dedicată, lângă tine.',
      bullets:['Comunicare directă','Preț fix, fără surprize','Suport rapid'] },
    { ico:'💎', tag:'05', title:'Prețuri',    lead:'Pachete clare pentru orice buget.',
      bullets:['Start de la 199£','Plată în rate','Fără costuri ascunse'] },
    { ico:'✉️', tag:'06', title:'Contact',    lead:'Hai să discutăm despre proiectul tău.',
      bullets:['Consultanță gratuită','Răspuns în 24h','+44 7312 799449'] },
  ];

  const orbit = document.getElementById('orbit');
  const rail  = document.getElementById('rail');
  const N = SECTIONS.length;
  const STEP = 360 / N;

  SECTIONS.forEach((s,i)=>{
    const f = document.createElement('div');
    f.className = 'frame';
    f.dataset.i = i;
    f.innerHTML = `<span class="badge">${s.tag}</span>
      <div class="ico">${s.ico}</div>
      <h3>${s.title}</h3>
      <div class="lead">${s.lead}</div>
      <ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
    orbit.appendChild(f);
    const dot = document.createElement('i'); dot.dataset.i = i;
    rail.appendChild(dot);
  });
  const frames = [...orbit.children];
  const dots   = [...rail.children];

  let R = 0;
  function recalc(){ R = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--orbit-radius')); }
  recalc(); addEventListener('resize', recalc);

  // ---- scroll → progress (smoothed) ----
  const stage = document.getElementById('stage');
  let target = 0, cur = 0;
  function readScroll(){
    const rect = stage.getBoundingClientRect();
    const total = stage.offsetHeight - innerHeight;
    target = Math.min(1, Math.max(0, (-rect.top) / total));
  }
  addEventListener('scroll', readScroll, {passive:true});
  readScroll();

  const hint     = document.getElementById('hint');
  const TURNS    = 1.0;             // each frame comes to the front exactly once across the page
  const PERSP    = 820;            // virtual camera distance (px) for the manual projection

  function frame(){
    cur += (target - cur) * 0.09;   // easing
    const p = cur;
    const baseRot = p * 360 * TURNS;

    let focusIdx = 0, bestZ = -1e9;
    frames.forEach((f,i)=>{
      const a = (baseRot + i*STEP) * Math.PI/180;
      const x = Math.sin(a) * R;     // left/right on the ring
      const z = Math.cos(a) * R;     // +R = nearest to camera (front), -R = behind globe
      const depth = (z + R) / (2*R); // 0 (back) … 1 (front)
      const pf    = PERSP / (PERSP - z);     // perspective: front frames project bigger
      const focus = Math.pow(depth, 4);      // only the near-front frame pulls to centre

      const sx = x * pf * (1 - focus) * 1.4; // spread side cards out; focused one pulls to centre
      const sy = (0.5 - depth) * 26 + focus * 150; // drop the focused card clearly below the globe
      let   s  = (0.42 + depth*0.34) * pf;   // small on the ring → grows toward the camera
      s = Math.min(1, s);                    // never exceed native size → stays crisp

      f.style.transform = `translate(-50%,-50%) translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${s.toFixed(3)})`;
      // back half fades right out so only the front card (and its neighbours) read clearly
      f.style.opacity   = Math.pow(depth, 2.2).toFixed(3);
      f.style.filter    = depth < 0.7 ? `blur(${((0.7-depth)*5).toFixed(1)}px)` : 'none';
      f.style.pointerEvents = depth > 0.6 ? 'auto' : 'none';
      f.style.zIndex    = Math.round(depth*100);   // front frames sit above the globe (z-index 50)
      f.classList.toggle('focused', depth > 0.93);

      if(z > bestZ){ bestZ = z; focusIdx = i; }
    });

    dots.forEach((d,i)=> d.classList.toggle('on', i===focusIdx));
    hint.style.opacity = p > 0.04 ? 0 : 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // click a rail dot → scroll to that frame's position
  rail.addEventListener('click', e=>{
    const i = e.target.dataset.i; if(i==null) return;
    const total = stage.offsetHeight - innerHeight;
    // angle where frame i is at front: baseRot + i*STEP = 360k  → baseRot = -i*STEP (mod 360)
    let needed = (-i*STEP) % 360; if(needed<0) needed+=360;
    const p = (needed/360)/TURNS;
    scrollTo({ top: stage.offsetTop + p*total, behavior:'smooth' });
  });
</script>
</body>
</html>
